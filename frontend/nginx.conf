# Same routing as the Vite dev proxy (vite.config.ts), pointed at the compose service names.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/orders        { proxy_pass http://order-service:8081; }
    location /api/ops           { proxy_pass http://order-service:8081; proxy_read_timeout 60s; }
    location /api/inventory     { proxy_pass http://inventory-service:8082; }
    location /api/payments      { proxy_pass http://payment-service:8083; }
    location /api/notifications { proxy_pass http://notification-service:8084; }

    location = /health/order        { proxy_pass http://order-service:8081/actuator/health; }
    location = /health/inventory    { proxy_pass http://inventory-service:8082/actuator/health; }
    location = /health/payment      { proxy_pass http://payment-service:8083/actuator/health; }
    location = /health/notification { proxy_pass http://notification-service:8084/actuator/health; }

    # Client-side routing: unknown paths fall back to the SPA.
    location / {
        try_files $uri /index.html;
    }
}
